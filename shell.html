<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./index.html" />
  <title>Intel Platform — redirecting</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #111722;
      --line: #1e2836;
      --text: #e8eef5;
      --muted: #91a3b7;
      --cyan: #3dd6d0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .card {
      width: min(90vw, 520px);
      padding: 28px 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(61,214,208,0.08);
    }
    .tag {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid rgba(61,214,208,0.38);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Intel Platform</div>
    <h1>Redirecting</h1>
    <p>
      This page is a duplicate shell. The live platform is at
      <a href="./index.html">index.html</a>.
    </p>
  </div>
</body>
</html>
