<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERIDIAN — Strategic Intelligence · by Leverage</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Situation Room palette — slate-navy base, signal-cyan accent, disciplined severity scale */
  --void:#0a0e14; --void2:#0c1119; --panel:#111722; --panel2:#141b28; --raised:#18202f;
  --line:#1e2836; --line2:#273449; --line3:#324258;
  --ice:#e8eef5; --text:#b8c6d6; --mute:#6b7d92; --dim:#43536a; --faint:#2a3646;
  --cyan:#3dd6d0; --cyan-d:rgba(61,214,208,.10); --cyan-g:rgba(61,214,208,.35);
  --amber:#e0a030; --amber-d:rgba(224,160,48,.10);
  --red:#e2564e; --red-d:rgba(226,86,78,.11);
  --grn:#4cc98a; --grn-d:rgba(76,201,138,.10);
  --violet:#9a7ff0; --violet-d:rgba(154,127,240,.10);
  --gold:#d4b24a; --gold-d:rgba(212,178,74,.10);
  --gov:#5b9bd5; --gov-d:rgba(91,155,213,.11);
  --econ:#4cc98a; --econ-d:rgba(76,201,138,.10);
  --ext:#e07a5f; --ext-d:rgba(224,122,95,.11);
  --FD:'Barlow Condensed',sans-serif; --FB:'Inter',sans-serif; --FM:'JetBrains Mono',monospace;
  --r:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--FB);font-size:13px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 55% at 15% -5%,rgba(61,214,208,.04),transparent 60%),radial-gradient(ellipse 70% 40% at 95% 120%,rgba(154,127,240,.03),transparent 50%);}

/* ── TOP BAR ── */
.topbar{position:relative;z-index:60;height:56px;min-height:56px;flex-shrink:0;background:rgba(12,17,25,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;flex-direction:column;gap:1px;}
.brand-main{font-family:var(--FD);font-size:21px;letter-spacing:4px;font-weight:700;color:var(--ice);line-height:1;}
.brand-sub b{color:var(--cyan);font-weight:700;letter-spacing:1.5px;}
.brand-sub{font-family:var(--FM);font-size:10px;letter-spacing:2.5px;color:var(--dim);}
.live-chip{display:flex;align-items:center;gap:6px;font-family:var(--FM);font-size:10px;letter-spacing:1.5px;color:var(--cyan);padding:4px 9px;border:1px solid var(--cyan-g);border-radius:100px;background:rgba(61,214,208,.02)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.wk-chip{font-family:var(--FM);font-size:10px;letter-spacing:1.5px;color:var(--amber);padding:4px 9px;border:1px solid rgba(224,160,48,.3);border-radius:100px;background:var(--amber-d);}
.search{margin-left:6px;display:flex;align-items:center;gap:7px;background:var(--void2);border:1px solid var(--line2);border-radius:var(--r);padding:6px 11px;transition:border-color .2s;}
.search:focus-within{border-color:var(--cyan-g);} 
.search svg{width:12px;height:12px;stroke:var(--dim);} 
.search input{background:none;border:none;outline:none;color:var(--ice);font-family:var(--FM);font-size:10px;letter-spacing:.5px;width:130px;} 
.search input::placeholder{color:var(--dim);} 
.stats{display:flex;gap:14px;margin-left:auto;align-items:center;} 
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:1px;} 
.stat b{font-family:var(--FM);font-size:16px;font-weight:600;line-height:1;} 
.stat span{font-family:var(--FM);font-size:9.5px;letter-spacing:1.5px;color:var(--dim);} 
.s-crit{color:var(--red)}.s-esc{color:var(--amber)}.s-desc{color:var(--grn)}.s-tot{color:var(--ice)} 
.clock{font-family:var(--FM);font-size:10px;letter-spacing:1px;color:var(--dim);text-align:right;line-height:1.5;padding-left:6px;border-left:1px solid var(--line);} 

/* ── TICKER / ALERT ── */
.ticker{position:relative;z-index:55;flex-shrink:0;height:30px;background:var(--void2);border-bottom:1px solid var(--line);display:flex;align-items:center;overflow:hidden;}
.ticker-tag{flex-shrink:0;height:100%;display:flex;align-items:center;gap:6px;padding:0 14px;font-family:var(--FM);font-size:10px;letter-spacing:2px;color:var(--amber);background:var(--amber-d);border-right:1px solid var(--line)}
.ticker-tag::before{content:'';width:5px;height:5px;background:var(--amber);border-radius:50%;}
.ticker-scroll{flex:1;overflow:hidden;white-space:nowrap;position:relative;}
.ticker-track{display:inline-block;padding-left:100%;animation:scroll 90s linear infinite;font-family:var(--FM);font-size:10.5px;letter-spacing:.5px;color:var(--mute);} 
.ticker-track b{color:var(--text);font-weight:500;} 
.ticker-track .up{color:var(--red);} .ticker-track .dn{color:var(--grn);} 
.ticker:hover .ticker-track{animation-play-state:paused;} 
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* layout + rest omitted for brevity; original CSS included */
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-main">MERIDIAN</div>
    <div class="brand-sub"><b>LEVERAGE</b> · STRATEGIC INTELLIGENCE · v60</div>
  </div>
  <div class="live-chip"><span class="live-dot"></span>LIVE</div>
  <div class="wk-chip">WEEK 16 · 16 JUL 2026</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search theaters, actors, systems, leverage…" oninput="onSearch(this.value)">
  </div>
  <div class="stats">
    <div class="stat"><b class="s-crit" id="sc">—</b><span>CRITICAL</span></div>
    <div class="stat"><b class="s-esc" id="se">—</b><span>ESCALATING</span></div>
    <div class="stat"><b class="s-desc" id="sd">—</b><span>EASING</span></div>
    <div class="stat"><b class="s-tot" id="st">—</b><span>THEATERS</span></div>
  </div>
  <div class="clock" id="clockBox">21 AUG 2026 · WK22<br><span id="clockCount">63</span> THEATERS · v60</div>
</div>

<div class="ticker">
  <div class="ticker-tag">SITREP</div>
  <div class="ticker-scroll"><div class="ticker-track" id="ticker"></div></div>
</div>

<div class="toolbar">
    <div class="tb-wrap">
      <div class="tb-row">
        <span class="tb-lbl">EXPORT</span>
        <button class="btn" onclick="exportKML()">↓ KML</button>
        <button class="btn" onclick="exportCSV()">↓ CSV</button>
        <span class="tb-lbl" style="margin-left:8px">ACTORS</span>
        <button class="btn btn-groups" onclick="openGroups()">🏴 Groups</button>
        <button class="btn btn-ext" onclick="openExt()">◆ Patrons</button>
      </div>
      <div class="tb-row">
        <span class="tb-lbl">STRUCTURE</span>
        <button class="btn btn-blocs" onclick="openBlocs()">⬡ Blocs</button>
        <button class="btn btn-sys" onclick="openSystems()">◈ Systems</button>
      </div>
    </div>
</div>

</body>
</html>
